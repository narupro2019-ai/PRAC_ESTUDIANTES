{% extends "base.html" %}
{% block content %}
<h2>Nueva Asignación de Práctica</h2>
<form method="POST">
    <div class="mb-3">
        <label>Estudiante</label>
        <select name="estudiante_id" class="form-control" required>
            <option value="">Seleccione...</option>
            {% for e in estudiantes %}
            <option value="{{ e['id'] }}">{{ e['nombre'] }} ({{ e['documento'] }})</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label>Docente</label>
        <select name="docente_id" class="form-control" required>
            <option value="">Seleccione...</option>
            {% for d in docentes %}
            <option value="{{ d['id'] }}">{{ d['nombre'] }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label>Escenario</label>
        <select name="escenario_id" class="form-control" required>
            <option value="">Seleccione...</option>
            {% for es in escenarios %}
            <option value="{{ es['id'] }}">{{ es['nombre'] }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="row">
        <div class="col-md-4">
            <label>Rotación (1-4)</label>
            <input type="number" name="rotacion" min="1" max="4" class="form-control" required>
        </div>
        <div class="col-md-4">
            <label>Horario</label>
            <input type="text" name="horario" class="form-control">
        </div>
    </div>
    <div class="row">
        <div class="col-md-6"><label>Fecha Inicio</label><input type="date" name="fecha_inicio" class="form-control"></div>
        <div class="col-md-6"><label>Fecha Fin</label><input type="date" name="fecha_fin" class="form-control"></div>
    </div>
    <button type="submit" class="btn btn-primary mt-3">Crear Asignación</button>
</form>
{% endblock %}
