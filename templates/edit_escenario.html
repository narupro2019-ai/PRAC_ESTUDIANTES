{% extends "base.html" %}
{% block content %}
<h2>Editar Escenario</h2>

<form method="POST">
    <div class="mb-3">
        <label>Nombre</label>
        <input type="text" name="nombre" value="{{ escenario['nombre'] }}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Código</label>
        <input type="text" name="codigo" value="{{ escenario.get('codigo','') }}" class="form-control">
    </div>
    <div class="mb-3">
        <label>Dirección</label>
        <input type="text" name="direccion" value="{{ escenario.get('direccion','') }}" class="form-control">
    </div>
    <div class="mb-3">
        <label>Cupos</label>
        <input type="number" name="cupos" value="{{ escenario.get('cupos',5) }}" class="form-control">
    </div>
    <button type="submit" class="btn btn-primary">Actualizar Escenario</button>
    <a href="/escenarios" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
