{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <h2>✏️ Editar Asignación</h2>
    
    <form method="POST">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label>Estudiante</label>
                <select class="form-select" name="estudiante_id" required>
                    {% for e in estudiantes %}
                    <option value="{{ e['id'] }}" {% if e['id'] == asignacion['estudiante_id'] %}selected{% endif %}>
                        {{ e['nombre'] }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label>Docente</label>
                <select class="form-select" name="docente_id" required>
                    {% for d in docentes %}
                    <option value="{{ d['id'] }}" {% if d['id'] == asignacion['docente_id'] %}selected{% endif %}>
                        {{ d['nombre'] }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label>Escenario</label>
                <select class="form-select" name="escenario_id" required>
                    {% for es in escenarios %}
                    <option value="{{ es['id'] }}" {% if es['id'] == asignacion['escenario_id'] %}selected{% endif %}>
                        {{ es['nombre'] }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3 mb-3">
                <label>Rotación</label>
                <select class="form-select" name="rotacion" required>
                    {% for i in range(1,6) %}
                    <option value="{{ i }}" {% if i == asignacion['rotacion'] %}selected{% endif %}>Rotación {{ i }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label>Horario</label>
                <input type="text" class="form-control" name="horario" value="{{ asignacion['horario'] }}">
            </div>
            <div class="col-md-4 mb-3">
                <label>Fecha Inicio</label>
                <input type="date" class="form-control" name="fecha_inicio" value="{{ asignacion['fecha_inicio'] }}" required>
            </div>
            <div class="col-md-4 mb-3">
                <label>Fecha Fin</label>
                <input type="date" class="form-control" name="fecha_fin" value="{{ asignacion['fecha_fin'] }}" required>
            </div>
        </div>

        <button type="submit" class="btn btn-success btn-lg">Guardar Cambios</button>
        <a href="{{ url_for('asignaciones_list') }}" class="btn btn-secondary btn-lg">Cancelar</a>
    </form>
</div>

{% endblock %}
