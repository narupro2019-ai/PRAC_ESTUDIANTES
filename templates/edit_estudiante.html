{% extends "base.html" %}
{% block content %}
<h2>Editar Estudiante</h2>

<form method="POST">
    <div class="mb-3">
        <label>Documento</label>
        <input type="text" name="documento" value="{{ estudiante['documento'] }}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Nombre Completo</label>
        <input type="text" name="nombre" value="{{ estudiante['nombre'] }}" class="form-control" required>
    </div>
    <div class="row">
        <div class="col-md-4">
            <label>Código Estudiantil</label>
            <input type="text" name="codigo" value="{{ estudiante.get('codigo','') }}" class="form-control">
        </div>
        <div class="col-md-4">
            <label>Semestre</label>
            <input type="number" name="semestre" value="{{ estudiante.get('semestre',1) }}" class="form-control">
        </div>
        <div class="col-md-4">
            <label>Grupo</label>
            <input type="text" name="grupo" value="{{ estudiante.get('grupo','') }}" class="form-control">
        </div>
    </div>
    <div class="mb-3">
        <label>Nivel de Práctica</label>
        <input type="text" name="nivel_practica" value="{{ estudiante.get('nivel_practica','') }}" class="form-control">
    </div>
    <div class="mb-3">
        <label>Dirección</label>
        <input type="text" name="direccion" value="{{ estudiante.get('direccion','') }}" class="form-control">
    </div>
    <div class="mb-3">
        <label>Celular</label>
        <input type="text" name="celular" value="{{ estudiante.get('celular','') }}" class="form-control">
    </div>
    <div class="mb-3">
        <label>Correo</label>
        <input type="email" name="correo" value="{{ estudiante.get('correo','') }}" class="form-control">
    </div>
    <button type="submit" class="btn btn-primary">Actualizar Estudiante</button>
    <a href="/estudiantes" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
