{% extends "base.html" %}
{% block content %}
<h2>Estudiantes</h2>
<a href="/register_estudiante" class="btn btn-primary mb-3">+ Nuevo Estudiante</a>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Documento</th>
            <th>Nombre</th>
            <th>Semestre</th>
            <th>Nivel</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for e in estudiantes %}
        <tr>
            <td>{{ e['documento'] }}</td>
            <td>{{ e['nombre'] }}</td>
            <td>{{ e['semestre'] }}</td>
            <td>{{ e['nivel_practica'] }}</td>
            <td>
                <a href="/edit_estudiante/{{ e['id'] }}" class="btn btn-sm btn-warning">Editar</a>
                <a href="/delete_estudiante/{{ e['id'] }}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar?')">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
